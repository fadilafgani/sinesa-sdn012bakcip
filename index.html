    <meta name="description" content="SINESA (Sistem Nilai Dan Evaluasi Siswa Aktif) - Platform kuis interaktif realtime berbasis gamifikasi untuk pembelajaran modern." />
    <!-- Google Fonts (Non-blocking font loading per Web Vitals / Ponytail) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" />

    <link rel="manifest" href="/manifest.json?v=3" />

  </head>
  <body class="bg-mesh min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        if (navigator.serviceWorker.controller) {
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (const registration of registrations) {
              registration.unregister();
            }
            if ('caches' in window) {
              caches.keys().then((names) => Promise.all(names.map((n) => caches.delete(n))))
                .then(() => window.location.reload());
            } else {
              window.location.reload();
            }
          });
        } else {
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (const registration of registrations) {
              registration.unregister();
            }
          });
        }
      }
    </script>
  </body>
</html>
