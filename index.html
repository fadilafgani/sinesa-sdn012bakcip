<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SINESA - Sistem Evaluasi Pembelajaran Siswa Realtime</title>
    <meta name="description" content="SINESA (Sistem Evaluasi Pembelajaran Siswa) - Platform kuis interaktif realtime berbasis gamifikasi untuk pembelajaran modern." />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="manifest" href="/manifest.json?v=3" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="apple-touch-icon" href="/icon-192.png?v=3" />
  </head>
  <body class="bg-mesh min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
              console.log('[SINESA] Service Worker registered:', reg.scope);
              
              // Auto-update check
              reg.onupdatefound = () => {
                const installingWorker = reg.installing;
                if (installingWorker) {
                  installingWorker.onstatechange = () => {
                    if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      console.log('[SINESA] New app version available, auto reloading...');
                      window.location.reload();
                    }
                  };
                }
              };
            })
            .catch((err) => console.error('[SINESA] Service Worker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
